# /etc/nginx/sites-available/teamcherry — certbot sẽ tự thêm phần HTTPS vào file này.
server {
    listen 80;
    listen [::]:80;
    server_name teamcherry.io.vn www.teamcherry.io.vn;

    # Đề bài PDF tối đa 20MB (files.service.ts).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè, KHÔNG nối thêm: app tin phần tử đầu để giới hạn dò mật khẩu theo IP (auth.service.ts).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
