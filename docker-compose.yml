# TeamCherry — hạ tầng phát triển (Postgres + MinIO)
# Dùng: npm run db:up

services:
  postgres:
    image: postgres:15-alpine
    container_name: teamcherry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamcherry
      POSTGRES_PASSWORD: teamcherry_dev_password
      POSTGRES_DB: teamcherry
      TZ: Asia/Ho_Chi_Minh
    ports:
      # 5433 (QLNS) và 5434 (recall-vault) đã bị chiếm trên máy dev → dùng 5435.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamcherry -d teamcherry"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: teamcherry-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teamcherry
      MINIO_ROOT_PASSWORD: teamcherry_dev_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      # 9100/9101 đã bị QLNS dùng → 9200/9201.
      - "9200:9000" # API S3
      - "9201:9001" # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
